<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcaea Multi Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>

    <div id="upload-screen">
        <h1>Arcaea Multi Dashboard</h1>
        <p>Arcaea Onlineから取得した<br><b>all.json</b> を選択してください。</p>
        <label class="file-upload-btn">
            📂 all.json を選択
            <input type="file" id="json-input" accept=".json" disabled>
        </label>
        <p id="master-status" class="master-status">⏳ 楽曲データを読み込み中...</p>
        <details class="upload-howto">
            <summary>📖 all.json の取り方</summary>
            <div id="upload-howto"></div>
        </details>
    </div>

    <div id="tab-menu">
        <span id="tab-buttons" class="tab-buttons"></span>
        <label class="tab-btn">
            🔄 データ更新
            <input type="file" id="json-update-input" accept=".json">
        </label>
        <button id="btn-backup" class="tab-btn" type="button">💾 バックアップを保存</button>
        <span id="data-status" class="data-status"></span>
    </div>

    <!-- はみ出し防止スクロールラッパー。各機能のビューは main.js が作る -->
    <div id="app-content"></div>

</body>
</html>
