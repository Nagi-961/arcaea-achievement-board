<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ⬇️ スマホ向けに画面サイズを最適化するタグを追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcaea Multi Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ⬇️ flexでの強制中央寄せをやめました */
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        
        #upload-screen { text-align: center; margin: 10vh auto; background: #1a1a1a; padding: 50px 20px; border-radius: 12px; border: 2px dashed #444; max-width: 600px; width: 90%; }
        .file-upload-btn { background: #1e90ff; color: #fff; padding: 15px 30px; font-size: 1.2em; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.2s; }
        input[type="file"] { display: none; }
        
        #tab-menu { display: none; justify-content: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #333; color: #fff; border: 2px solid #555; padding: 12px 30px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: #1e90ff; border-color: #1e90ff; }

        /* ⬇️ 横スクロールを許可するラッパー */
        #app-content { width: 100%; overflow-x: auto; padding-bottom: 80px; }

        /* PCでの基本スタイル */
        .capture-area { width: 1430px; background: #121212; padding: 30px 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #222; margin: 0 auto 40px auto; }
        
        /* ⬇️ ここが左端見切れを直すスマホ用CSS！ 画面幅が足りない時は左詰めに変更します */
        @media (max-width: 1470px) {
            .capture-area { margin: 0 0 40px 0; }
        }

        .header-container { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 15px; }
        .header-container h1 { margin: 0; color: #eee; letter-spacing: 2px; font-size: 2.2em; }
        .title-sub { color: #1e90ff; font-size: 0.7em; letter-spacing: 1px; }
        
        .summary-table { border-collapse: collapse; font-size: 0.9em; background: #0a0a0a; border: 1px solid #444; }
        .summary-table th, .summary-table td { border: 1px solid #333; padding: 4px 12px; text-align: right; font-family: monospace; font-weight: bold; }
        .summary-table th { background: #1a1a1a; color: #eee; text-align: center; font-family: sans-serif; font-size: 0.85em; }
        .summary-table .lvl-col { text-align: center; color: #fff; background: #1a1a1a; font-family: sans-serif; }
        .summary-table .rate { color: #00e676; }
        
        .constant-section { margin-bottom: 35px; }
        .constant-header { font-size: 1.6em; font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 5px; margin-bottom: 15px; color: #ccc; }
        .tile-container { display: flex; flex-wrap: wrap; gap: 12px; }
        .tile { width: 100px; height: 100px; position: relative; border-radius: 0px; border: 2px solid #444; overflow: hidden; background: #222; box-sizing: border-box; }
        .jacket { width: 100%; height: 100%; object-fit: cover; }
        .noplay .jacket { filter: grayscale(100%) brightness(30%); }
        
        .grade, .score-bar { position: absolute; bottom: 0; left: 0; width: 100%; text-align: center; font-size: 0.85em; font-weight: bold; padding: 2px 0; z-index: 2; border-top: 1px solid #333; }
        .score-bar { font-family: monospace; letter-spacing: 0.5px; }
        
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; opacity: 0; transition: opacity 0.2s; z-index: 3; padding: 4px; box-sizing: border-box; }
        .tile:hover .overlay { opacity: 1; }
        .o-title { font-size: 0.75em; margin-bottom: 5px; font-weight: bold; word-break: break-all; }
        .o-score { font-size: 0.8em; font-family: monospace; color: #00e676; }
        .o-rank { font-size: 0.9em; font-weight: bold; margin-top: 2px; }
        
        .controls { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; }
        .btn-export { background: #1e90ff; color: white; border: none; padding: 10px 20px; font-size: 0.95em; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); width: 180px; text-align: center; display: none; }
        .btn-export:hover { background: #0073e6; }
        
        /* スマホ向けに保存ボタンを少し小さくして邪魔にならないようにする */
        @media (max-width: 768px) {
            .controls { top: 10px; right: 10px; transform: scale(0.85); transform-origin: top right; }
        }
    </style>
</head>

    <div id="upload-screen">

    </div>

    <div id="tab-menu">

        </div>
        <div id="rank-content"></div>

        document.getElementById('json-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const scores = JSON.parse(event.target.result);
                    processGlobalData(scores);
                    document.getElementById('upload-screen').style.display = 'none';
                    document.getElementById('tab-menu').style.display = 'flex';
                    switchMode('rank');

                }
            };
            reader.readAsText(file);
        });

        function levelSortKey(lvl) { return parseFloat(lvl.replace('+', '.5')) || 0; }

        function processGlobalData(scoreList) {
            const scoreDict = {};
            scoreList.forEach(s => {
                let diffVal = s.difficulty;
                let diffStr = diffMap[diffVal] || String(diffVal);
                const isIns = MASTER_DATA.some(m => m.song_id === s.song_id && m.difficulty === "INS");
                if (diffVal === 3 && isIns) diffStr = "INS";
                scoreDict[s.song_id + "_" + diffStr] = s;
            });

            MASTER_DATA.forEach(song => {
                const key = song.song_id + "_" + song.difficulty;
                const rec = scoreDict[key];
                let score = 0, clearType = -1, perfect = 0, near = 0, miss = 0;
                if (rec) {
                    score = rec.score || 0;
                    clearType = rec.clear_type || 0;
                    perfect = rec.perfect_count || 0;
                    near = rec.near_count || 0;
                    miss = rec.miss_count || 0;
                }

                let grade = "NO PLAY";
                if (score > 0) {
                    if (score >= 9900000) grade = "EX+";
                    else if (score >= 9800000) grade = "EX";
                    else if (score >= 9500000) grade = "AA";
                    else if (score >= 9200000) grade = "A";
                    else if (score >= 8900000) grade = "B";
                    else if (score >= 8600000) grade = "C";
                    else grade = "D";
                    
                    if (clearType === 3) {
                        const totalNotes = perfect + near + miss;
                        const maxScore = 10000000 + totalNotes;
                        grade = (totalNotes > 0 && score >= maxScore) ? "MAX" : "PM";
                    }
                }
                song.grade = grade;
                song.scoreVal = score;
            });
            
            drawRankBoard();
            drawScoreBoard();
        }

            document.getElementById('view-rank').style.display = 'none';
            document.getElementById('view-score').style.display = 'none';

            document.getElementById('tab-score').classList.remove('active');
            
            document.querySelectorAll('.btn-export').forEach(b => b.style.display = 'none');

        function exportImage(areaId, filename, btnId) {
            const btn = document.getElementById(btnId);
            const originalText = btn.textContent;
            btn.textContent = "⏳ 生成中...";
            btn.style.backgroundColor = "#555";
            const element = document.getElementById(areaId);
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            
            html2canvas(element, { backgroundColor: '#121212', scale: 2.5, useCORS: true }).then(canvas => {
                if (isIOS) {
                    showModal(canvas.toDataURL('image/png'));
                } else {
                    canvas.toBlob(function(blob) {
                        const url = window.URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = url;
                        link.click();
                        setTimeout(() => window.URL.revokeObjectURL(url), 1000);
                    }, 'image/png');
                }
                btn.textContent = originalText;
                btn.style.backgroundColor = "#1e90ff";
            }).catch(err => {
                alert("画像生成中にエラーが発生しました。");
                btn.textContent = originalText;
                btn.style.backgroundColor = "#1e90ff";
            });
        }

            closeBtn.style.background = "#ff4c4c"; closeBtn.style.color = "#fff"; closeBtn.style.border = "none"; closeBtn.style.borderRadius = "4px";
            closeBtn.onclick = () => document.body.removeChild(modal);
            
            modal.appendChild(msg); modal.appendChild(img); modal.appendChild(closeBtn);
            document.body.appendChild(modal);
        }

        
    function drawRankBoard() {
        const grouped11 = {}; const grouped10p = {}; const grouped10 = {};
        const summaryData = {};

        MASTER_DATA.forEach(song => {
            const lvl = song.level;
            if (!summaryData[lvl]) summaryData[lvl] = { "MAX":0, "PM":0, "EX+":0, "EX":0, "AA":0, "A":0, "B-D":0, "NP":0, "Total":0 };
            summaryData[lvl].Total++;
            let g = song.grade;
            if (summaryData[lvl][g] !== undefined) summaryData[lvl][g]++;
            else if (["B","C","D"].includes(g)) summaryData[lvl]["B-D"]++;
            else if (g === "NO PLAY") summaryData[lvl]["NP"]++;

            const c = song.constant;
            if (["11", "11+", "12"].includes(lvl)) { if (!grouped11[c]) grouped11[c]=[]; grouped11[c].push(song); }
            else if (lvl === "10+") { if (!grouped10p[c]) grouped10p[c]=[]; grouped10p[c].push(song); }
            else { if (!grouped10[c]) grouped10[c]=[]; grouped10[c].push(song); }
        });

        const sortedLvls = Object.keys(summaryData).sort((a,b) => levelSortKey(a) - levelSortKey(b));
        let summaryHtml = `<table class="summary-table"><tr><th>Lv</th><th style="color:#ffdf00;">MAX</th><th style="color:#ffd700;">PM</th><th style="color:#00ffff;">EX+</th><th style="color:#32cd32;">EX</th><th style="color:#ff4c4c;">AA</th><th style="color:#ff4c4c;">A</th><th style="color:#ff4c4c;">B-D</th><th style="color:#777777;">NP</th><th>Total</th><th>EX+↑</th></tr>`;
        const fmt = (v) => v > 0 ? v : '<span style="color:#444;">-</span>';
        sortedLvls.forEach(lvl => {
            const row = summaryData[lvl];
            const total = row.Total;
            const exPlus = row.MAX + row.PM + row["EX+"];
            const rate = total > 0 ? (exPlus / total * 100).toFixed(1) : 0;
            summaryHtml += `<tr><td class="lvl-col">${lvl}</td><td style="color:#ffdf00; text-shadow:0 0 5px #ffdf00;">${fmt(row.MAX)}</td><td style="color:#ffd700;">${fmt(row.PM)}</td><td style="color:#00ffff;">${fmt(row['EX+'])}</td><td style="color:#32cd32;">${fmt(row.EX)}</td><td style="color:#ff4c4c;">${fmt(row.AA)}</td><td style="color:#ff4c4c;">${fmt(row.A)}</td><td style="color:#ff4c4c;">${fmt(row['B-D'])}</td><td style="color:#777777;">${fmt(row.NP)}</td><td>${total}</td><td class="rate">${rate}%</td></tr>`;
        });
        summaryHtml += `</table>`;

        let finalHtml = "";
        const sections = [
            { title: "Level 11〜12", id: "rank-area-11", data: grouped11 },
            { title: "Level 10+", id: "rank-area-10p", data: grouped10p },
            { title: "Level 10", id: "rank-area-10", data: grouped10 }
        ];

        sections.forEach(sec => {
            if (Object.keys(sec.data).length === 0) return;
            finalHtml += `<div id="${sec.id}" class="capture-area">
                            <div class="header-container">
                                <h1>Arcaea Achievement <span class="title-sub">[${sec.title}]</span></h1>
                                ${summaryHtml}
                            </div>`;
            
            const sortedConsts = Object.keys(sec.data).map(Number).sort((a,b) => b - a);
            sortedConsts.forEach(c => {
                finalHtml += `<div class="constant-section"><div class="constant-header">CC: ${c.toFixed(1)}</div><div class="tile-container">`;
                const songs = sec.data[c].sort((a,b) => a.title.toLowerCase().localeCompare(b.title.toLowerCase()));
                songs.forEach(song => {
                    let gColor = gradeColors[song.grade];
                    if (!gColor && ["AA","A","B","C","D"].includes(song.grade)) gColor = gradeColors["AA"];
                    else if (!gColor) gColor = gradeColors["NO PLAY"];
                    
                    const dColor = diffColors[song.difficulty] || "#444";
                    const scoreStr = song.scoreVal > 0 ? song.scoreVal.toLocaleString() : "---";
                    const noplayCls = song.scoreVal === 0 ? " noplay" : "";
                    let imgSrc = IMAGES[song.song_id + "_" + song.difficulty] || IMAGES['default'];

                    finalHtml += `
                    <div class="tile${noplayCls}" style="border-color: ${dColor};">
                        <img src="${imgSrc}" class="jacket" alt="${song.title}">
                        <div class="grade" style="background: ${gColor.bg}; color: ${gColor.color}; text-shadow: ${gColor.shadow};">${song.grade}</div>
                        <div class="overlay"><div class="o-title">${song.title}</div><div class="o-score">${scoreStr}</div></div>
                    </div>`;
                });
                finalHtml += `</div></div>`;
            });
            finalHtml += `</div>`;
        });
        document.getElementById('rank-content').innerHTML = finalHtml;
    }
